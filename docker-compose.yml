services:
  # Database PostgreSQL Service
  db:
    image: postgres:16-alpine
    container_name: sprech_mit_uns_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sprech_mit_uns}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sprech_mit_uns}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production App Service (Tùy chọn: chỉ bật khi muốn test bản Production build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprech_mit_uns_app
    restart: always
    profiles: ["production"]
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in .env}
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NUXT_PUBLIC_SENTRY_ENVIRONMENT=${NUXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SMU_TTS_PROVIDER=${SMU_TTS_PROVIDER:-google}
      - NUXT_PUBLIC_TTS_MODE=${NUXT_PUBLIC_TTS_MODE:-auto}
      - SMU_ALLOW_DEMO=${SMU_ALLOW_DEMO:-}
      - SMU_SEED_DEMO=${SMU_SEED_DEMO:-}
      - NUXT_PUBLIC_SHOW_DEMO=${NUXT_PUBLIC_SHOW_DEMO:-}
      - SMU_ALLOW_CATALOG_WRITES=${SMU_ALLOW_CATALOG_WRITES:-}
      - SMU_ADMIN_EMAILS=${SMU_ADMIN_EMAILS:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sprech_mit_uns}?schema=public
      - DIRECT_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sprech_mit_uns}?schema=public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/me || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
