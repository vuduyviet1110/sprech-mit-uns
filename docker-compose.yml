services:
  # Database PostgreSQL Service
  db:
    image: postgres:16-alpine
    container_name: sprech_mit_uns_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sprech_mit_uns}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sprech_mit_uns}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production App Service (Tùy chọn: chỉ bật khi muốn test bản Production build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprech_mit_uns_app
    restart: always
    profiles: ["production"]
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sprech_mit_uns}?schema=public
      - DIRECT_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sprech_mit_uns}?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
