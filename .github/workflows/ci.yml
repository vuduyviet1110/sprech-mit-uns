name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprech_mit_uns
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sprech_mit_uns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      NUXT_SESSION_PASSWORD: ci-test-session-password-min-32chars
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprech_mit_uns?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprech_mit_uns?schema=public
      SMU_TTS_PROVIDER: off
      NUXT_PUBLIC_TTS_MODE: browser
      NUXT_TELEMETRY_DISABLED: 1
      SMU_ALLOW_DEMO: 1
      SMU_SEED_DEMO: 1
      NUXT_PUBLIC_SHOW_DEMO: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Prisma migrate
        run: pnpm exec prisma migrate deploy

      - name: Prisma seed
        run: pnpm exec prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          NODE_ENV: production
